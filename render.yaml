services:
  # Backend API Service
  - type: web
    name: warhammer-ranking-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: warhammer-ranking-db
          property: connectionString
      - key: API_HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false

  # Frontend Static Site
  - type: web
    name: warhammer-ranking-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://warhammer-ranking-api.onrender.com/api/v1

databases:
  - name: warhammer-ranking-db
    databaseName: warhammer_rankings
    user: warhammer_admin
    plan: free
    region: oregon
